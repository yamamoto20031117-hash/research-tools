<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QE 計算結果 — qe-auto ダッシュボード</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#080b12;color:#ccc;font-family:'Helvetica Neue',Arial,'Meiryo',sans-serif;min-height:100vh}
  #top{position:sticky;top:0;background:rgba(8,11,18,0.92);backdrop-filter:blur(10px);padding:12px 18px;border-bottom:1px solid #1a2030;z-index:10;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #top a{color:#58a6ff;text-decoration:none;font-size:.9rem}
  #top h1{font-size:1.05rem;color:#fff;margin-right:8px}
  #top .meta{font-size:.76rem;color:#888}
  #top button{padding:5px 14px;font-size:.82rem;background:rgba(88,166,255,.15);color:#9ad0ff;border:1px solid #58a6ff;border-radius:5px;cursor:pointer}
  #top button:hover{background:rgba(88,166,255,.25)}
  #top select{background:#181d27;color:#ddd;border:1px solid #2a3040;border-radius:5px;padding:4px 8px;font-size:.82rem}
  #mode{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;padding:3px 8px;border-radius:4px;font-weight:600}
  #mode.live{background:rgba(56,178,108,.18);color:#5fd592;border:1px solid #38b26c}
  #mode.cached{background:rgba(120,140,180,.13);color:#aabad6;border:1px solid #5a6a8c}
  #mode .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  #mode.live .dot{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  main{padding:16px 22px;max-width:1280px;margin:0 auto}
  .summary{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .stat{background:#10141c;border:1px solid #1f2638;border-radius:8px;padding:10px 16px;min-width:130px}
  .stat-label{font-size:.7rem;color:#888;text-transform:uppercase;letter-spacing:.5px}
  .stat-val{font-size:1.5rem;font-weight:600;color:#fff;margin-top:3px;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:.84rem}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #1a2030;font-variant-numeric:tabular-nums}
  th{background:#101521;color:#9ad0ff;font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:64px;z-index:5}
  tr:hover{background:rgba(88,166,255,0.05)}
  td.pk{color:#888;font-size:.74rem}
  .badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.7rem;font-weight:600;text-transform:uppercase}
  .badge-finished{background:rgba(56,178,108,.18);color:#5fd592;border:1px solid #38b26c}
  .badge-running{background:rgba(255,191,73,.15);color:#ffcc55;border:1px solid #ffbf49}
  .badge-waiting{background:rgba(120,140,180,.13);color:#aabad6;border:1px solid #5a6a8c}
  .badge-failed{background:rgba(220,80,80,.15);color:#ff7a7a;border:1px solid #c14444}
  .badge-other{background:rgba(160,160,160,.12);color:#aaa;border:1px solid #555}
  .chart-btn{padding:3px 8px;font-size:.78rem;background:rgba(150,200,255,.1);color:#9ad0ff;border:1px solid #2a3850;border-radius:4px;cursor:pointer}
  .chart-btn:hover{background:rgba(150,200,255,.22);border-color:#58a6ff}
  .chart-btn:disabled{opacity:.4;cursor:not-allowed}
  details{margin:6px 0;border-top:1px solid #1a2030;padding-top:6px}
  details pre{background:#0c0f15;border:1px solid #1a2030;border-radius:4px;padding:8px 10px;font-size:.72rem;overflow-x:auto;color:#9ad0ff}
  .empty{padding:32px;text-align:center;color:#666}
  .err{color:#ff7a7a;font-size:.78rem;margin-top:8px}

  /* Modal */
  #modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  #modal[hidden]{display:none}
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px)}
  .dialog{position:relative;background:#0c0f15;border:1px solid #1a2030;border-radius:10px;padding:18px;max-width:1180px;width:100%;max-height:94vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .dialog-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #1a2030;gap:14px;flex-wrap:wrap}
  .dialog-head h2{font-size:1rem;color:#fff;font-weight:600}
  .dialog-head .close{background:transparent;color:#888;border:none;font-size:1.4rem;cursor:pointer;padding:0 8px;line-height:1}
  .dialog-head .close:hover{color:#fff}
  .dialog-info{display:flex;gap:14px;font-size:.75rem;color:#aabad6;flex-wrap:wrap;margin-top:4px}
  .dialog-info b{color:#fff;font-weight:600}
  .dialog-info code{background:#181d27;padding:1px 6px;border-radius:3px;color:#9ad0ff}

  /* Tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid #1a2030;margin-bottom:10px;overflow-x:auto;flex-shrink:0}
  .tab{padding:8px 16px;font-size:.85rem;color:#888;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit}
  .tab:hover{color:#9ad0ff}
  .tab.active{color:#58a6ff;border-bottom-color:#58a6ff}
  .tab-content{flex:1;overflow-y:auto;min-height:480px;position:relative}
  .tab-pane{display:none}
  .tab-pane.active{display:block;height:100%}
  #plot-area, #pdos-area, #conv-area{min-height:480px}
  #struct-area{min-height:480px;display:flex;gap:14px;align-items:stretch}
  #struct-canvas-wrap{flex:1;min-height:480px;background:#080b12;border:1px solid #1a2030;border-radius:6px;position:relative;overflow:hidden}
  #struct-side{flex:0 0 280px;padding:6px 0;display:flex;flex-direction:column;gap:10px;font-size:.78rem}
  #struct-side table{font-size:.78rem}
  #struct-side th, #struct-side td{padding:4px 8px;border-bottom:1px solid #161b27}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:8px 0}
  .summary-card{background:#10141c;border:1px solid #1f2638;border-radius:8px;padding:12px 16px}
  .summary-card h3{font-size:.78rem;color:#9ad0ff;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:600}
  .summary-card .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted #1a2030;font-size:.82rem}
  .summary-card .row:last-child{border-bottom:none}
  .summary-card .key{color:#888}
  .summary-card .val{color:#fff;font-variant-numeric:tabular-nums}
  /* Evaluation tags */
  .judge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:.7rem;font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
  .judge-good{background:rgba(56,178,108,.18);color:#5fd592;border:1px solid #38b26c}
  .judge-okay{background:rgba(255,191,73,.15);color:#ffcc55;border:1px solid #ffbf49}
  .judge-bad{background:rgba(220,80,80,.15);color:#ff7a7a;border:1px solid #c14444}
  .judge-na{background:rgba(160,160,160,.12);color:#aaa;border:1px solid #555}
  .row-note{display:block;font-size:.68rem;color:#7a8398;line-height:1.35;margin-top:2px;padding-left:0;font-style:italic;font-weight:400}
  .summary-card .row{display:flex;flex-direction:column;justify-content:space-between;padding:6px 0;border-bottom:1px dotted #1a2030;font-size:.82rem;gap:0}
  .summary-card .row .main{display:flex;justify-content:space-between;align-items:baseline}
  .summary-card .ref-tag{font-size:.7rem;color:#7a8398;margin-left:6px}
  .help-banner{background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.25);border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:.8rem;color:#aabad6;line-height:1.55}
  .help-banner b{color:#9ad0ff}
  .conv-status{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .conv-status-card{background:#10141c;border:1px solid #1f2638;border-radius:6px;padding:8px 14px;font-size:.78rem;min-width:170px}
  .conv-status-card .label{color:#888;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .conv-status-card .val{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
  .conv-status-card.good{border-color:#38b26c}
  .conv-status-card.okay{border-color:#ffbf49}
  .conv-status-card.bad{border-color:#c14444}

  /* Big visual progress panel */
  .prog-panel{background:linear-gradient(180deg,#0e1620 0%,#10141c 100%);border:1px solid #1f2638;border-radius:8px;padding:14px 18px;margin-bottom:12px}
  .prog-headline{font-size:1.05rem;color:#fff;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:10px}
  .prog-light{font-size:1.35rem}
  .prog-row{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid #1a2030}
  .prog-row:first-of-type{border-top:none}
  .prog-icon{font-size:1.2rem;width:28px;text-align:center}
  .prog-label{flex:0 0 80px;font-size:.85rem;color:#ccc}
  .prog-current{flex:0 0 120px;font-size:.82rem;color:#fff;font-variant-numeric:tabular-nums;font-weight:600}
  .prog-bar-wrap{flex:1;height:18px;background:#0a0d14;border:1px solid #1a2030;border-radius:9px;position:relative;overflow:hidden;min-width:120px}
  .prog-bar{height:100%;border-radius:9px;transition:width .4s ease;position:relative}
  .prog-bar.good{background:linear-gradient(90deg,#2d8557,#5fd592)}
  .prog-bar.okay{background:linear-gradient(90deg,#a37a18,#ffcc55)}
  .prog-bar.bad{background:linear-gradient(90deg,#7a2c2c,#ff7a7a)}
  .prog-bar-target{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.6}
  .prog-bar-target::after{content:'目標';position:absolute;top:-14px;left:-12px;font-size:.62rem;color:#fff;opacity:.7;white-space:nowrap}
  .prog-ratio{flex:0 0 90px;font-size:.78rem;color:#aabad6;font-variant-numeric:tabular-nums;text-align:right}
  .prog-summary{margin-top:10px;padding-top:8px;border-top:1px solid #1a2030;font-size:.82rem;color:#aabad6;line-height:1.5}
  .loading{padding:50px;text-align:center;color:#888}
  .loading .spin{display:inline-block;width:20px;height:20px;border:2px solid #2a3850;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:600px){
    main{padding:10px}
    th,td{padding:5px 6px;font-size:.76rem}
    .stat{padding:8px 12px;min-width:110px}
    .dialog{padding:12px}
    #plot-area,#pdos-area,#conv-area,#struct-area{min-height:380px}
    #struct-area{flex-direction:column}
    #struct-side{flex:0 0 auto}
    .summary-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="top">
  <a href="/" title="Research Tools トップ">&#8592;</a>
  <h1>QE 計算結果</h1>
  <a href="gallery.html" style="color:#3bf0ff;text-decoration:none;font-size:.85rem;border:1px solid #2a3640;border-radius:8px;padding:4px 10px">🖼 発表用ギャラリー →</a>
  <span id="mode" class="cached" title="データの取得方法"><span class="dot"></span><span id="mode-label">—</span></span>
  <span class="meta" id="gen-at">—</span>
  <button id="refresh">&#x21bb; 再読込</button>
  <label class="meta">
    フィルタ:
    <select id="filter">
      <option value="hi-level">主要 WorkChain (デフォルト)</option>
      <option value="QeFullWorkChain">親のみ (QeFullWorkChain)</option>
      <option value="all">全部</option>
      <option value="finished">完了のみ</option>
      <option value="running">実行中</option>
      <option value="failed">失敗</option>
    </select>
  </label>
  <label class="meta" title="ライブ取得成功時のみ有効">
    <input type="checkbox" id="auto" checked>
    自動更新 (5s)
  </label>
</div>

<main>
  <div class="summary" id="stats"></div>
  <div id="table-wrap"></div>
  <div id="err" class="err"></div>
</main>

<!-- Multi-tab detail modal -->
<div id="modal" hidden>
  <div class="backdrop"></div>
  <div class="dialog">
    <div class="dialog-head">
      <div>
        <h2 id="modal-title">詳細</h2>
        <div class="dialog-info" id="modal-info"></div>
      </div>
      <button class="close" id="modal-close" aria-label="閉じる">&times;</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="bands">📊 バンド</button>
      <button class="tab" data-tab="pdos">📈 PDOS</button>
      <button class="tab" data-tab="struct">📐 構造</button>
      <button class="tab" data-tab="conv">⚙️ 収束</button>
      <button class="tab" data-tab="summary">📋 サマリ</button>
    </div>
    <div class="tab-content">
      <div class="tab-pane active" id="pane-bands"><div id="plot-area"></div></div>
      <div class="tab-pane" id="pane-pdos"><div id="pdos-area"></div></div>
      <div class="tab-pane" id="pane-struct">
        <div id="struct-area">
          <div id="struct-canvas-wrap"></div>
          <div id="struct-side"></div>
        </div>
      </div>
      <div class="tab-pane" id="pane-conv"><div id="conv-area"></div></div>
      <div class="tab-pane" id="pane-summary"><div id="summary-area"></div></div>
    </div>
  </div>
</div>

<script>
const STATE_BADGE = {
  finished: 'finished', created: 'waiting', waiting: 'waiting',
  running: 'running', killed: 'failed', excepted: 'failed', unknown: 'other'
};

// QE 結果は lab-ubuntu の qe_sender.py が Firebase RTDB の qe/ 名前空間に push し、
// ここから読む（誰でも閲覧可）。RTDB は <base>/<path>.json で JSON をそのまま返す。
const LIVE_BASE = 'https://research-tools-board-default-rtdb.firebaseio.com/qe';
const LIVE_URL = LIVE_BASE + '/results.json';
const STATIC_URL = 'data/results.json';
const LIVE_TIMEOUT_MS = 6000;
const AUTO_REFRESH_MS = 5000;

let autoTimer = null;
let isLive = false;
let currentPK = null;
let currentLabel = null;
// (cacheKey, urlPath) pairs — cache keys are arbitrary, urlPath matches the
// server endpoint exactly. Don't conflate them: /structure ≠ /struct etc.
const ENDPOINT = {
  bands:   {cache: 'bands',     url: 'bands'},
  pdos:    {cache: 'pdos',      url: 'pdos'},
  struct:  {cache: 'struct',    url: 'structure'},
  conv:    {cache: 'conv',      url: 'trajectory'},
  summary: {cache: 'summary',   url: 'details'},
};
const dataCache = {};
for (const k of Object.values(ENDPOINT)) dataCache[k.cache] = {};

async function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    // Firebase RTDB REST は未知のクエリ (_=…) に 400 を返すため cache-buster は付けず no-store で取得
    const res = await fetch(url, {signal: ctrl.signal, cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(t);
  }
}

function setMode(live) {
  isLive = live;
  const el = document.getElementById('mode');
  const lbl = document.getElementById('mode-label');
  if (live) {
    el.className = 'live';
    lbl.textContent = 'LIVE (Firebase)';
    el.title = 'lab-ubuntu の qe_sender.py が Firebase に push した結果 (5 秒ごと自動更新)';
  } else {
    el.className = 'cached';
    lbl.textContent = 'CACHED';
    el.title = '静的スナップショット (refresh_dashboard.sh 実行時の状態)';
  }
}

function scheduleAuto() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  if (!isLive) return;
  if (!document.getElementById('auto').checked) return;
  if (!document.getElementById('modal').hidden) return;
  autoTimer = setTimeout(load, AUTO_REFRESH_MS);
}

async function load() {
  document.getElementById('err').textContent = '';
  let data;
  try {
    data = await fetchWithTimeout(LIVE_URL, LIVE_TIMEOUT_MS);
    if (!data || !data.results) throw new Error('Firebase にまだ QE 結果がありません');
    setMode(true);
  } catch (eLive) {
    try {
      data = await fetchWithTimeout(STATIC_URL, 5000);
      setMode(false);
    } catch (eStatic) {
      setMode(false);
      document.getElementById('err').textContent = '読み込み失敗: ' + eStatic.message;
      return;
    }
  }
  render(data);
  scheduleAuto();
}

function hasDetails(r) {
  // QeFullWorkChain, PwRelaxWorkChain, PwBandsWorkChain, PdosWorkChain — anything with descendants
  return ['QeFullWorkChain','PwRelaxWorkChain','PwBandsWorkChain','PdosWorkChain'].includes(r.process_label);
}

function render(data) {
  document.getElementById('gen-at').textContent =
    '生成: ' + new Date(data.generated_at).toLocaleString('ja-JP') + ` (${data.n_results} 件)`;

  const HI_LEVEL = ['QeFullWorkChain', 'PwRelaxWorkChain', 'PwBandsWorkChain', 'PdosWorkChain'];
  const filter = document.getElementById('filter').value;
  let rows = data.results || [];
  if (filter === 'hi-level') rows = rows.filter(r => HI_LEVEL.includes(r.process_label));
  else if (filter === 'QeFullWorkChain') rows = rows.filter(r => r.process_label === 'QeFullWorkChain');
  else if (filter === 'finished') rows = rows.filter(r => r.finished_ok);
  else if (filter === 'running') rows = rows.filter(r => ['running', 'waiting', 'created'].includes(r.state));
  else if (filter === 'failed') rows = rows.filter(r => ['excepted', 'killed'].includes(r.state));

  const all = data.results || [];
  const total = all.length;
  const done = all.filter(r => r.finished_ok).length;
  const running = all.filter(r => ['running','waiting','created'].includes(r.state)).length;
  const failed = all.filter(r => ['excepted','killed'].includes(r.state)).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">total</div><div class="stat-val">${total}</div></div>
    <div class="stat"><div class="stat-label">完了</div><div class="stat-val" style="color:#5fd592">${done}</div></div>
    <div class="stat"><div class="stat-label">実行中</div><div class="stat-val" style="color:#ffcc55">${running}</div></div>
    <div class="stat"><div class="stat-label">失敗</div><div class="stat-val" style="color:#ff7a7a">${failed}</div></div>
  `;

  if (rows.length === 0) {
    document.getElementById('table-wrap').innerHTML = '<div class="empty">フィルタに該当するエントリがありません。</div>';
    return;
  }

  const headers = ['PK', 'Label', 'WorkChain', '状態', 'Formula', '原子数', 'E_tot [eV]', 'E_F [eV]', 'Gap [eV]', 'M [μB]', '作成日時', '詳細'];
  let html = '<table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
  for (const r of rows) {
    const stateKey = STATE_BADGE[r.state] || 'other';
    const badge = `<span class="badge badge-${stateKey}">${r.state}</span>`;
    const detailCell = hasDetails(r)
      ? `<button class="chart-btn" data-pk="${r.pk}" data-label="${escape(r.label||'')}">🔍 開く</button>`
      : '-';
    html += '<tr>' +
      `<td class="pk">${r.pk}</td>` +
      `<td><strong>${escape(r.label)}</strong></td>` +
      `<td><span style="color:#888;font-size:.76rem">${escape(r.process_label||'')}</span></td>` +
      `<td>${badge}</td>` +
      `<td>${escape(r.formula||'-')}</td>` +
      `<td>${r.natoms||'-'}</td>` +
      `<td>${r.total_energy_ev !== undefined ? r.total_energy_ev.toFixed(4) : '-'}</td>` +
      `<td>${r.fermi_energy_ev !== undefined ? r.fermi_energy_ev.toFixed(4) : '-'}</td>` +
      `<td>${r.band_gap_ev !== undefined ? (r.is_metallic ? 'metal' : r.band_gap_ev.toFixed(3)) : '-'}</td>` +
      `<td>${r.total_magnetization !== undefined ? r.total_magnetization.toFixed(3) : '-'}</td>` +
      `<td><span style="color:#888;font-size:.74rem">${r.ctime ? new Date(r.ctime).toLocaleString('ja-JP', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-'}</span></td>` +
      `<td>${detailCell}</td>` +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('table-wrap').innerHTML = html;

  document.querySelectorAll('.chart-btn').forEach(b => {
    b.addEventListener('click', () => openDetailModal(parseInt(b.dataset.pk, 10), b.dataset.label));
  });
}

function escape(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// =========================================================
// Modal + tab management
// =========================================================

function openDetailModal(pk, label) {
  currentPK = pk;
  currentLabel = label;
  document.getElementById('modal').hidden = false;
  document.getElementById('modal-title').textContent = `詳細 — PK ${pk} (${label || '—'})`;
  document.getElementById('modal-info').innerHTML = '';
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }

  // Switch to bands tab by default
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'bands'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-bands'));
  loadTab('bands');
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    const id = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + id));
    loadTab(id);
  });
});

async function loadTab(tab) {
  if (currentPK == null) return;
  switch (tab) {
    case 'bands':   return loadBands();
    case 'pdos':    return loadPdos();
    case 'struct':  return loadStruct();
    case 'conv':    return loadConv();
    case 'summary': return loadSummary();
  }
}

async function fetchEndpoint(tabKey, pk) {
  const ep = ENDPOINT[tabKey];
  if (!ep) throw new Error('unknown endpoint: ' + tabKey);
  if (dataCache[ep.cache][pk]) return dataCache[ep.cache][pk];
  const res = await fetch(`${LIVE_BASE}/${ep.url}/${pk}.json`, {cache: 'no-store'});
  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error(`空レスポンス (HTTP ${res.status}) — ${ep.url} データがまだ Firebase に push されていない可能性`);
  }
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  if (data === null) throw new Error(`${ep.url} データがまだありません (lab-ubuntu の qe_sender.py 未送信)`);
  dataCache[ep.cache][pk] = data;
  return data;
}

function setLoading(container, msg = '読み込み中…') {

}
function setError(container, msg) {
  container.innerHTML = `<div class="empty" style="color:#ff7a7a">${escape(msg)}</div>`;
}

// Normalize formula: "Se2V" or "VSe2" → canonical key.
function normalizeFormula(formula) {
  if (!formula) return null;
  // Strip subscript numbers, sort by element to get a "signature"
  const re = /([A-Z][a-z]?)(\d*)/g;
  const counts = {};
  let m;
  while ((m = re.exec(formula)) !== null) {
    if (!m[1]) continue;
    counts[m[1]] = (counts[m[1]] || 0) + (parseInt(m[2]) || 1);
  }
  // Try direct match for VSe2-like keys
  // Reduce by GCD if all counts share one
  const vals = Object.values(counts);
  const gcd = vals.reduce((a, b) => {
    while (b) { [a, b] = [b, a % b]; } return a;
  }, vals[0] || 1);
  const reduced = Object.fromEntries(Object.entries(counts).map(([k, v]) => [k, v/gcd]));
  // Canonical sort: metals first (V, Ti, Mo, W, Si, C, etc.), then chalcogens
  const order = ['V','Ti','Mo','W','Si','Ni','Fe','Mn','Co','C','N','O','S','Se','Te','H','P','F'];
  const sorted = Object.keys(reduced).sort((a,b) => {
    const ia = order.indexOf(a); const ib = order.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  return sorted.map(k => k + (reduced[k] > 1 ? reduced[k] : '')).join('');
}

function getMaterialRef(formula) {
  const key = normalizeFormula(formula);
  return REFERENCE[key] || null;
}

// Judge value against expected/reference. Returns {judge: 'good'|'okay'|'bad'|'na', err_pct, badge}
function judgeAgainst(value, ref_value, opts={}) {
  if (value === null || value === undefined || ref_value === null || ref_value === undefined) {
    return {judge: 'na', err_pct: null, badge: ''};
  }
  const tol_good = opts.tol_good ?? 0.01;   // 1%
  const tol_okay = opts.tol_okay ?? 0.05;   // 5%
  const err = Math.abs((value - ref_value) / (ref_value || 1));
  if (err <= tol_good) return {judge: 'good', err_pct: err*100, badge: `<span class="judge judge-good">◯ ±${(err*100).toFixed(2)}%</span>`};
  if (err <= tol_okay) return {judge: 'okay', err_pct: err*100, badge: `<span class="judge judge-okay">△ ±${(err*100).toFixed(2)}%</span>`};
  return {judge: 'bad', err_pct: err*100, badge: `<span class="judge judge-bad">✗ ±${(err*100).toFixed(1)}%</span>`};
}

// Judge absolute-tolerance (e.g. magmom)
function judgeAbs(value, ref_value, opts={}) {
  if (value === null || value === undefined || ref_value === null || ref_value === undefined) {
    return {judge: 'na', badge: ''};
  }
  const tol_good = opts.tol_good ?? 0.1;
  const tol_okay = opts.tol_okay ?? 0.5;
  const err = Math.abs(value - ref_value);
  if (err <= tol_good) return {judge: 'good', badge: `<span class="judge judge-good">◯</span>`};
  if (err <= tol_okay) return {judge: 'okay', badge: `<span class="judge judge-okay">△</span>`};
  return {judge: 'bad', badge: `<span class="judge judge-bad">✗</span>`};
}

async function loadBands() {
  const area = document.getElementById('plot-area');
  setLoading(area, 'バンド構造を取得中…');
  let bands;
  try { bands = await fetchEndpoint('bands', currentPK); }
  catch (e) { setError(area, '取得失敗: ' + e.message); return; }
  renderBandChart(bands);
}

function renderBandChart(bands) {
  const fermi = bands.fermi ?? 0;
  const distances = bands.distances;
  const spinUp = bands.spin_up;
  const spinDown = bands.spin_down;
  const nBands = bands.n_bands;
  const labels = bands.labels || [];

  function bandTraces(matrix, color, name) {
    const traces = [];
    for (let b = 0; b < nBands; b++) {
      const y = matrix.map(kpt => kpt[b] - fermi);
      traces.push({
        x: distances, y,
        type: 'scattergl', mode: 'lines',
        line: {color, width: 1.5},
        name: b === 0 ? name : undefined,
        showlegend: b === 0 && spinDown !== null,
        hovertemplate: 'k=%{x:.3f}<br>E−E_F=%{y:.3f} eV<extra>band ' + (b+1) + '</extra>',
        legendgroup: name,
      });
    }
    return traces;
  }

  const traces = bandTraces(spinUp, spinDown ? '#5fd592' : '#58a6ff', spinDown ? '↑ spin up' : '');
  if (spinDown) traces.push(...bandTraces(spinDown, '#ff7a7a', '↓ spin down'));

  let yMin = Infinity, yMax = -Infinity;
  for (const kpt of spinUp) for (const e of kpt) {
    const v = e - fermi; if (v < yMin) yMin = v; if (v > yMax) yMax = v;
  }
  if (spinDown) for (const kpt of spinDown) for (const e of kpt) {
    const v = e - fermi; if (v < yMin) yMin = v; if (v > yMax) yMax = v;
  }
  const yLow = Math.max(yMin, -8), yHigh = Math.min(yMax, 8);

  const shapes = labels.map(l => ({type: 'line', xref: 'x', yref: 'paper', x0: l.distance, x1: l.distance, y0: 0, y1: 1, line: {color: '#384058', width: 1}}));
  shapes.push({type: 'line', xref: 'paper', yref: 'y', x0: 0, x1: 1, y0: 0, y1: 0, line: {color: '#ff7a7a', width: 1.2, dash: 'dash'}});

  const layout = {
    paper_bgcolor: '#0c0f15', plot_bgcolor: '#0c0f15',
    font: {color: '#ccc', family: "Helvetica Neue, Arial, sans-serif"},
    xaxis: {tickmode: 'array', tickvals: labels.map(l => l.distance), ticktext: labels.map(l => l.label.replace('GAMMA','Γ').replace('G','Γ')), gridcolor: '#1a2030', zeroline: false, range: [distances[0], distances[distances.length-1]], showline: true, linecolor: '#384058'},
    yaxis: {title: {text: 'E − E<sub>F</sub> (eV)', font: {size: 12}}, gridcolor: '#1a2030', zeroline: false, range: [yLow, yHigh], showline: true, linecolor: '#384058'},
    shapes, margin: {l: 60, r: 20, t: 20, b: 40}, hovermode: 'closest',
  };

  Plotly.newPlot('plot-area', traces, layout, {responsive: true, displaylogo: false, toImageButtonOptions: {filename: `bands_pk${bands.pk}`, format: 'png', width: 1200, height: 700}});

  const labelText = labels.length ? labels.map(l => l.label.replace('GAMMA','Γ').replace('G','Γ')).join(' — ') : '(なし)';
  document.getElementById('modal-info').innerHTML = `
    <span><b>${bands.formula || '—'}</b></span>
    <span>E<sub>F</sub> <code>${fermi.toFixed(4)} eV</code></span>
    <span>k-points <code>${bands.n_kpoints}</code></span>
    <span>bands <code>${bands.n_bands}</code></span>
    <span>path <code>${labelText}</code></span>
  `;
}

}

let structRenderer = null, structScene = null, structCamera = null, structControls = null, structAnimFrame = null;

async function loadStruct() {
  const area = document.getElementById('struct-canvas-wrap');
  const side = document.getElementById('struct-side');
  area.innerHTML = '<div class="loading"><span class="spin"></span> 構造データ取得中…</div>';
  side.innerHTML = '';
  let data;
  try { data = await fetchEndpoint('struct', currentPK); }
  catch (e) { setError(area, '取得失敗: ' + e.message); return; }
  renderStructure(data);
}

const ATOM_RADII = {H:0.31,C:0.76,N:0.71,O:0.66,F:0.57,P:1.07,S:1.05,V:1.34,Ti:1.36,Mo:1.54,W:1.62,Se:1.20,Te:1.38,Ni:1.24,Fe:1.32,Mn:1.39,Co:1.26};
const ATOM_COLORS = {H:0xffffff,C:0x666666,N:0x3050f8,O:0xff0d0d,F:0x90e050,P:0xff8000,S:0xffff30,V:0xa6a6ab,Ti:0xbfc2c7,Mo:0x54b5b5,W:0x2194d6,Se:0xffa100,Te:0xd47a00,Ni:0x50d050,Fe:0xe06633,Mn:0x9c7ac7,Co:0xf090a0};

function renderStructure(data) {
  const wrap = document.getElementById('struct-canvas-wrap');
  wrap.innerHTML = '';
  if (structAnimFrame) cancelAnimationFrame(structAnimFrame);

  const W = wrap.clientWidth || 600, H = wrap.clientHeight || 480;
  structScene = new THREE.Scene();
  structScene.background = new THREE.Color(0x080b12);
  structCamera = new THREE.PerspectiveCamera(45, W/H, 0.1, 1000);
  const cellMax = Math.max(data.a, data.b, data.c);
  structCamera.position.set(cellMax * 1.5, cellMax * 1.2, cellMax * 2.0);
  structRenderer = new THREE.WebGLRenderer({antialias: true});
  structRenderer.setSize(W, H);
  wrap.appendChild(structRenderer.domElement);

  const amb = new THREE.AmbientLight(0xffffff, 0.5);
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(5, 10, 7);
  structScene.add(amb); structScene.add(dir);

  // Cell box
  const cellBox = new THREE.Group();
  const cell = data.cell;
  const o = new THREE.Vector3(0,0,0);
  const v = cell.map(r => new THREE.Vector3(...r));
  const cellMat = new THREE.LineBasicMaterial({color: 0x3a4458});
  function lineSegment(p0, p1) {
    const g = new THREE.BufferGeometry().setFromPoints([p0, p1]);
    return new THREE.Line(g, cellMat);
  }
  const corners = [o, v[0], v[1], v[2], v[0].clone().add(v[1]), v[0].clone().add(v[2]), v[1].clone().add(v[2]), v[0].clone().add(v[1]).add(v[2])];
  const edges = [[0,1],[0,2],[0,3],[1,4],[1,5],[2,4],[2,6],[3,5],[3,6],[4,7],[5,7],[6,7]];
  for (const [i,j] of edges) cellBox.add(lineSegment(corners[i], corners[j]));
  // Center the cell at origin in scene
  const center = new THREE.Vector3();
  corners.forEach(c => center.add(c));
  center.divideScalar(corners.length);
  cellBox.position.sub(center);
  structScene.add(cellBox);

  // Atoms
  for (const site of data.sites) {
    const r = (ATOM_RADII[site.kind] ?? 0.7) * 0.5;
    const color = ATOM_COLORS[site.kind] ?? 0xaaaaaa;
    const geom = new THREE.SphereGeometry(r, 24, 24);
    const mat = new THREE.MeshPhongMaterial({color, shininess: 80});
    const m = new THREE.Mesh(geom, mat);
    m.position.set(site.x - center.x, site.y - center.y, site.z - center.z);
    structScene.add(m);
  }

  structControls = new THREE.OrbitControls(structCamera, structRenderer.domElement);
  structControls.enableDamping = true;
  structControls.dampingFactor = 0.08;

  function animate() {
    structAnimFrame = requestAnimationFrame(animate);
    structControls.update();
    structRenderer.render(structScene, structCamera);
  }
  animate();

  // Side info
  const side = document.getElementById('struct-side');
  const counts = {};
  for (const s of data.sites) counts[s.kind] = (counts[s.kind]||0) + 1;
  const elemRow = Object.entries(counts).map(([k,v]) => `${k}<sub>${v}</sub>`).join('');

  const ref = getMaterialRef(data.formula);
  const refKey = normalizeFormula(data.formula);
  const refPretty = ref ? ref.pretty : `${escape(data.formula)} (文献値未登録)`;

  // Lattice rows with evaluation
  function lattRow(label, value, ref_param) {
    if (!ref || !ref.lattice || !ref.lattice[ref_param]) {
      return `<div class="row"><div class="main"><span class="key">${label}</span><span class="val">${value.toFixed(4)} Å</span></div></div>`;
    }
    const r = ref.lattice[ref_param];
    const target = r.dft_pbe ?? r.exp;
    const j = judgeAgainst(value, target);
    let refLine = '';
    if (r.exp !== undefined) refLine += `実験 ${r.exp.toFixed(3)} Å`;
    if (r.dft_pbe !== undefined) refLine += (refLine ? ' / ' : '') + `DFT-PBE ${r.dft_pbe.toFixed(3)} Å`;
    return `<div class="row">
      <div class="main"><span class="key">${label}</span><span class="val">${value.toFixed(4)} Å ${j.badge}</span></div>
      <span class="row-note">文献 → ${refLine}</span>
    </div>`;
  }

  function gammaRow(value) {
    if (!ref || ref.lattice?.gamma === undefined) {
      return `<div class="row"><div class="main"><span class="key">γ</span><span class="val">${value.toFixed(2)}°</span></div></div>`;
    }
    const j = judgeAbs(value, ref.lattice.gamma, {tol_good: 0.2, tol_okay: 1.0});
    return `<div class="row">
      <div class="main"><span class="key">γ</span><span class="val">${value.toFixed(2)}° ${j.badge}</span></div>
      <span class="row-note">期待 ${ref.lattice.gamma}° (六方/三方 = 120°)</span>
    </div>`;
  }

  side.innerHTML = `
    <div class="help-banner">
      <b>${refPretty}</b><br>
      ${ref ? ref.notes : '文献値が登録されていない系。a/b/c の数値だけ表示します。'}
      ${ref ? `<br><span style="color:#7a8398;font-size:.7rem">出典: ${escape(ref.citations)}</span>` : ''}
    </div>
    <div class="summary-card">
      <h3>緩和後の格子定数</h3>
      ${lattRow('a', data.a, 'a')}
      ${lattRow('b', data.b, 'a')}
      ${lattRow('c', data.c, 'c')}
      <div class="row"><div class="main"><span class="key">α</span><span class="val">${data.alpha.toFixed(2)}°</span></div></div>
      <div class="row"><div class="main"><span class="key">β</span><span class="val">${data.beta.toFixed(2)}°</span></div></div>
      ${gammaRow(data.gamma)}
    </div>
    <div class="summary-card">
      <h3>組成</h3>
      <div class="row"><div class="main"><span class="key">化学式</span><span class="val">${escape(data.formula)}</span></div></div>
      <div class="row"><div class="main"><span class="key">構成元素</span><span class="val">${elemRow}</span></div></div>
      <div class="row"><div class="main"><span class="key">原子数</span><span class="val">${data.n_atoms}</span></div></div>
    </div>
    <div style="font-size:.72rem;color:#888;padding:4px 6px">
      🖱️ ドラッグで回転、ホイールでズーム<br>
      <span style="color:#5fd592">◯</span> ±1% 以内（最高）/ <span style="color:#ffcc55">△</span> ±5%（許容）/ <span style="color:#ff7a7a">✗</span> >5%（要見直し）
    </div>
  `;
}

// =========================================================
// Tab: Convergence
// =========================================================

async function loadConv() {
  const area = document.getElementById('conv-area');
  setLoading(area, 'BFGS トラジェクトリ取得中…');
  let data;
  try { data = await fetchEndpoint('conv', currentPK); }
  catch (e) { setError(area, '取得失敗: ' + e.message); return; }
  renderConvergence(data);
}

function renderConvergence(data) {
  // Build a status panel + explanation banner above the plot
  const area = document.getElementById('conv-area');
  // ---- compute key values ----
  const F_TARGET = 1e-4;
  const E_TARGET = 3e-5 * 13.6057;   // ~4e-4 eV
  const lastF = data.total_force ? data.total_force[data.total_force.length-1] : null;
  const initF = data.total_force ? data.total_force[0] : null;
  const dE = (data.energy && data.energy.length >= 2)
    ? Math.abs(data.energy[data.energy.length-1] - data.energy[data.energy.length-2])
    : null;
  const initDE = (data.energy && data.energy.length >= 2)
    ? Math.abs(data.energy[1] - data.energy[0]) : null;

  function judgeMetric(curr, target) {
    if (curr === null || curr === undefined) return {cls:'na', icon:'⏳', text:'データなし'};
    if (curr < target) return {cls:'good', icon:'🟢', text:'達成 ✓', ratio:1};
    const r = curr / target;
    if (r < 10)  return {cls:'okay', icon:'🟡', text:`あと ${r.toFixed(1)}× 縮める`, ratio:r};
    if (r < 100) return {cls:'okay', icon:'🟠', text:`あと ${r.toFixed(0)}× 縮める`, ratio:r};
    return            {cls:'bad',  icon:'🔴', text:`あと ${r.toExponential(1)}× 縮める`, ratio:r};
  }
  function progressFrac(curr, init, target) {
    if (curr == null || init == null) return 0;
    if (curr <= target) return 1;
    if (init <= target) return 1;
    const p = 1 - Math.log10(curr/target) / Math.log10(init/target);
    return Math.max(0.05, Math.min(1, p));
  }

  const fJ = judgeMetric(lastF, F_TARGET);
  const eJ = judgeMetric(dE, E_TARGET);
  const fProg = progressFrac(lastF, initF, F_TARGET);
  const eProg = progressFrac(dE, initDE, E_TARGET);

  const allGood = fJ.cls === 'good' && eJ.cls === 'good';
  const overall = allGood ? {emoji:'🟢', text:'構造最適化 完了 ✓'}
                 : fJ.cls === 'bad' ? {emoji:'🔴', text:'収束まで遠い（序盤）'}
                 : {emoji:'🟡', text:'収束間近、もう少し'};

  area.innerHTML = `
    <div class="prog-panel">
      <div class="prog-headline">
        <span class="prog-light">${overall.emoji}</span>
        <span>${overall.text}</span>
        <span style="color:#888;font-size:.8rem;font-weight:400;margin-left:auto">BFGS step ${data.n_steps}</span>
      </div>

      <div class="prog-row">
        <span class="prog-icon">${fJ.icon}</span>
        <span class="prog-label">力 |F|</span>
        <span class="prog-current">${lastF != null ? lastF.toExponential(2) : '—'} Ry/Bohr</span>
        <div class="prog-bar-wrap" title="目標 ${F_TARGET.toExponential(0)} Ry/Bohr">
          <div class="prog-bar ${fJ.cls}" style="width:${(fProg*100).toFixed(0)}%"></div>
        </div>
        <span class="prog-ratio">${fJ.text}</span>
      </div>

      <div class="prog-row">
        <span class="prog-icon">${eJ.icon}</span>
        <span class="prog-label">ΔE</span>
        <span class="prog-current">${dE != null ? dE.toExponential(2) : '—'} eV</span>
        <div class="prog-bar-wrap" title="目標 ${E_TARGET.toExponential(1)} eV">
          <div class="prog-bar ${eJ.cls}" style="width:${(eProg*100).toFixed(0)}%"></div>
        </div>
        <span class="prog-ratio">${eJ.text}</span>
      </div>

      <div class="prog-summary">
        <b>読み方</b>:バーが <b>右端まで届けば収束</b>。緑=達成、黄=もう少し、赤=まだ遠い。<br>
        ${allGood ? '✅ 平衡構造に到達。SCF + bands + PDOS に進める。'
                  : (fJ.cls === 'bad' ? '🔴 まだ序盤。BFGS が原子位置を大きく動かしてる段階。'
                                       : `🟡 力があと <b>${fJ.ratio?.toFixed(1)}×</b> 縮めば収束。1-2 BFGS step で達成見込み。`)}
      </div>
    </div>

    <div class="help-banner">
      <b>下のグラフが見せてるもの</b>:
      <span style="color:#58a6ff">青線 E_tot</span> = 全エネルギー /
      <span style="color:#ff7a7a">赤線 |F|</span> = 力（対数軸） /
      <span style="color:#ffcc55">P</span>, <span style="color:#5fd592">a</span>, <span style="color:#c58dff">c</span> は凡例クリックで表示。
      <br><span style="color:#5fd592">緑のゾーン</span>が力収束ゾーン（|F| < 1×10⁻⁴）。グラフの赤線がこのゾーンに入れば収束達成。
    </div>
    <div id="conv-plot" style="min-height:420px"></div>
  `;

  const N = data.n_steps;
  const xs = Array.from({length: N}, (_, i) => i);
  const traces = [];
  if (data.energy) {
    traces.push({x: xs, y: data.energy, type: 'scatter', mode: 'lines+markers', name: 'E_tot (eV)', yaxis: 'y', line: {color: '#58a6ff'}, marker: {size: 6}});
  }
  if (data.total_force) {
    traces.push({x: xs, y: data.total_force, type: 'scatter', mode: 'lines+markers', name: '|F| (Ry/Bohr)', yaxis: 'y2', line: {color: '#ff7a7a'}, marker: {size: 6}});
  }
  // Optional traces — each on its own invisible axis with a *fixed* range
  // so toggling one in the legend doesn't rescale and visually shift the others.
  function fixedRange(arr) {
    if (!arr || !arr.length) return null;
    const lo = Math.min(...arr), hi = Math.max(...arr);
    const pad = Math.max((hi - lo) * 0.25, Math.abs(hi) * 0.01, 0.005);
    return [lo - pad, hi + pad];
  }
  const rangeP = fixedRange(data.pressure_kbar);
  const rangeA = fixedRange(data.lattice_a);
  const rangeC = fixedRange(data.lattice_c);

  if (data.pressure_kbar) {
    traces.push({x: xs, y: data.pressure_kbar, type: 'scatter', mode: 'lines+markers', name: 'P (kbar)', yaxis: 'y3', line: {color: '#ffcc55'}, marker: {size: 5}, visible: 'legendonly'});
  }
  if (data.lattice_a) {
    traces.push({x: xs, y: data.lattice_a, type: 'scatter', mode: 'lines+markers', name: 'a (Å)', yaxis: 'y4', line: {color: '#5fd592'}, marker: {size: 5}, visible: 'legendonly'});
  }
  if (data.lattice_c) {
    traces.push({x: xs, y: data.lattice_c, type: 'scatter', mode: 'lines+markers', name: 'c (Å)', yaxis: 'y5', line: {color: '#c58dff'}, marker: {size: 5}, visible: 'legendonly'});
  }

  const shapes = [
    // Shaded "converged zone" — |F| below target
    {
      type: 'rect', xref: 'paper', yref: 'y2',
      x0: 0, x1: 1, y0: 1e-12, y1: F_TARGET,
      fillcolor: 'rgba(56,178,108,0.12)',
      line: {width: 0},
      layer: 'below',
    },
    // Target line
    {
      type: 'line', xref: 'paper', yref: 'y2',
      x0: 0, x1: 1, y0: F_TARGET, y1: F_TARGET,
      line: {color: '#5fd592', width: 1.5, dash: 'dash'}
    },
  ];

  // Highlight the latest data point on |F|
  if (data.total_force && data.total_force.length > 0) {
    const lastIdx = data.total_force.length - 1;
    traces.push({
      x: [lastIdx], y: [data.total_force[lastIdx]],
      type: 'scatter', mode: 'markers', name: '現在',
      yaxis: 'y2',
      marker: {color: '#ffcc55', size: 14, line: {color: '#fff', width: 2}, symbol: 'circle'},
      showlegend: false,
      hovertemplate: '現在地<br>step %{x}<br>|F|=%{y:.2e}<extra></extra>',
    });
  }

  const layout = {
    paper_bgcolor: '#0c0f15', plot_bgcolor: '#0c0f15', font: {color: '#ccc'},
    xaxis: {title: 'BFGS step (relax iteration)', gridcolor: '#1a2030', zeroline: false},
    yaxis: {title: {text: 'E_tot (eV)', font: {color: '#58a6ff'}}, gridcolor: '#1a2030', zeroline: false, color: '#58a6ff'},
    yaxis2: {title: {text: '|F| (Ry/Bohr)', font: {color: '#ff7a7a'}}, overlaying: 'y', side: 'right', type: 'log', color: '#ff7a7a', showgrid: false},
    // Each optional trace gets its own private axis with a fixed range so toggling is independent.
    yaxis3: {overlaying: 'y', visible: false, range: rangeP, autorange: false, fixedrange: true},
    yaxis4: {overlaying: 'y', visible: false, range: rangeA, autorange: false, fixedrange: true},
    yaxis5: {overlaying: 'y', visible: false, range: rangeC, autorange: false, fixedrange: true},
    shapes,
    margin: {l: 70, r: 70, t: 20, b: 50},
    hovermode: 'x unified',
    legend: {orientation: 'h', x: 0, y: 1.12},
    annotations: [{
      x: 0, y: F_TARGET, xref: 'paper', yref: 'y2',
      text: '目標 |F| 1e-4', xanchor: 'left', font: {size: 10, color: '#ff7a7a'},
      showarrow: false, yshift: -12,
    }],
  };
  Plotly.newPlot('conv-plot', traces, layout, {responsive: true, displaylogo: false});
}

// =========================================================
// Tab: Summary
// =========================================================

async function loadSummary() {
  const area = document.getElementById('summary-area');
  setLoading(area, 'サマリ取得中…');
  let data;
  try { data = await fetchEndpoint('summary', currentPK); }
  catch (e) { setError(area, '取得失敗: ' + e.message); return; }
  renderSummary(data);
}

function fmt(v, digits=4) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') return v.toFixed(digits);
  if (Array.isArray(v)) return v.map(x => typeof x === 'number' ? x.toFixed(digits) : x).join(', ');
  return String(v);
}

function renderSummary(data) {
  const v = data.values || {};
  const bs = data.builder_spec || {};

  // Helper: build a row with description + value + optional badge
  // row = {label, value, fmt?, unit?, desc, judge?, target?}
  function richRow(row) {
    const formatted = row.fmt !== undefined ? row.fmt : fmt(row.value);
    const badge = row.judge ? row.judge.badge : '';
    const note = row.desc ? `<span class="row-note">${row.desc}</span>` : '';
    return `<div class="row">
      <div class="main">
        <span class="key">${escape(row.label)}</span>
        <span class="val">${escape(formatted)} ${row.unit || ''} ${badge}</span>
      </div>
      ${note}
    </div>`;
  }
  function card(title, rows, helpHtml) {
    const help = helpHtml ? `<div style="font-size:.72rem;color:#7a8398;margin-bottom:6px;line-height:1.45">${helpHtml}</div>` : '';
    return `<div class="summary-card"><h3>${escape(title)}</h3>${help}${rows.map(richRow).join('')}</div>`;
  }

  // Pull reference for the running material
  // Try to get formula from the structure or relax output.
  // The /details endpoint doesn't directly include formula; reuse the struct cache if available
  const formula = (dataCache.struct[currentPK] && dataCache.struct[currentPK].formula) || '';
  const ref = getMaterialRef(formula);

  // Force judgment
  const F = v.total_force;
  const fJudge = F === undefined ? null : (F < 1e-4 ? {badge: '<span class="judge judge-good">◯ 収束</span>'}
                                          : F < 1e-3 ? {badge: '<span class="judge judge-okay">△ 収束間近</span>'}
                                          : {badge: '<span class="judge judge-bad">⏳ 未収束</span>'});

  // Magmom judgment vs reference
  const mJudge = (ref && ref.mag_total !== undefined && v.total_magnetization !== undefined)
    ? judgeAbs(Math.abs(v.total_magnetization), ref.mag_total, {tol_good: 0.1, tol_okay: 0.5})
    : null;

  // SOC indicator badge
  const socBadge = bs.soc
    ? '<span class="judge judge-good">SOC ON</span>'
    : '<span class="judge judge-na">SOC OFF (高速 screening)</span>';

  document.getElementById('summary-area').innerHTML = `
    ${ref ? `<div class="help-banner">
      <b>${ref.pretty}</b> — ${escape(ref.notes)}
      <br><span style="color:#7a8398;font-size:.7rem">出典: ${escape(ref.citations)}</span>
    </div>` : ''}
    <div class="summary-grid">
      ${card('エネルギー', [
        {label: '全エネルギー', value: v.energy, unit: 'eV',
         desc: '系全体の DFT 全エネルギー。関数依存の絶対値で、同じ pseudo/protocol 同士でのみ意味を持つ比較値。'},
        {label: '交換相関 E_xc', value: v.energy_xc, unit: 'eV',
         desc: 'PBE 関数の「魂」。電子相関を密度の汎関数で近似する項。'},
        {label: '1 電子 (kinetic + ext)', value: v.energy_one_electron, unit: 'eV',
         desc: '電子の運動エネルギー + 外部ポテンシャル（核との引力）。'},
        {label: 'Hartree', value: v.energy_hartree, unit: 'eV',
         desc: '電子-電子の古典的なクーロン反発。'},
        {label: 'Ewald (核-核)', value: v.energy_ewald, unit: 'eV',
         desc: '周期境界下での核-核反発エネルギー（Ewald 和で計算）。'},
        {label: 'smearing 補正', value: v.energy_smearing, unit: 'eV',
         desc: '金属の有限温度的占有（Fermi-Dirac/cold smearing）の自由エネルギー補正。'},
        {label: 'Fermi 準位 E_F', value: v.fermi_energy, unit: 'eV',
         desc: '0 K で電子が占有する最高準位。バンド構造の基準点（赤い破線）。'},
      ], 'eV 単位で全エネルギー成分が分解される。物理的に重要なのは <b>E_F</b>（バンドの基準）と <b>E_tot</b>（系同士の相対比較に使う）。')}

      ${card('力 / 応力 / 磁性', [
        {label: '全力 |F|', value: v.total_force,
         fmt: v.total_force !== undefined ? v.total_force.toExponential(3) : '—',
         unit: 'Ry/Bohr',
         judge: fJudge,
         desc: '全原子に働く力の RMS。<b>< 1×10⁻⁴ Ry/Bohr で構造収束</b>。relax 完走で十分小さくなる。'},
        {label: '全磁化', value: v.total_magnetization, unit: 'μB',
         judge: mJudge,
         desc: '単位セル中の正味スピン（↑−↓）。' + (ref && ref.mag_total !== undefined ? `期待値 ${ref.mag_total} μB（${ref.expected_state}）。` : '') +
               '<b>0</b>=反磁性/Pauli, <b>整数</b>≈強磁性的局所モーメント, <b>非整数</b>=フラストレートや弱磁性。'},
        {label: '絶対磁化', value: v.absolute_magnetization, unit: 'μB',
         desc: '|↑| + |↓| の積分。total_mag=0 でも abs_mag>0 なら反強磁性（↑↓打ち消し）。'},
        {label: 'ストレス対角成分',
         value: v.stress_kbar,
         fmt: v.stress_kbar ? `${v.stress_kbar[0]?.[0]?.toFixed(2)}, ${v.stress_kbar[1]?.[1]?.toFixed(2)}, ${v.stress_kbar[2]?.[2]?.toFixed(2)}` : '—',
         unit: 'kbar',
         desc: '結晶への圧力テンソル σxx, σyy, σzz。vc-relax 後は ~0 になるべき（残圧 < 0.5 kbar）。'},
        {label: '電子数', value: v.number_of_electrons,
         desc: '価電子数。VSe₂ なら V(13) + 2×Se(6) = 25 個。'},
        {label: 'バンド数', value: v.number_of_bands,
         desc: '計算したバンドの本数。SOC ON だと 2x になる（スピノル波動関数）。'},
        {label: '原子数', value: v.number_of_atoms,
         desc: 'ユニットセル中の原子数。'},
      ], '構造最適化と磁性の主要指標。<b>|F|</b> が収束基準、<b>magmom</b> で物性を読む。')}

      ${card('計算条件 (BuilderSpec)', [
        {label: 'protocol', value: bs.protocol,
         desc: 'aiida-quantumespresso のプリセット。<b>fast</b> < <b>moderate</b> < <b>precise</b>（精度 / コスト両方）。'},
        {label: 'vdW 補正', value: bs.vdw,
         desc: 'ファンデルワールス分散補正。<b>d3</b>=Grimme D3（標準）、層間距離（c 軸）に効く。'},
        {label: 'spin タイプ', value: bs.spin,
         desc: 'none=non-spin-polarized, fm=強磁性初期, afm=反強磁性初期。'},
        {label: 'SOC', value: bs.soc,
         fmt: bs.soc ? 'ON' : 'OFF',
         judge: {badge: socBadge},
         desc: 'スピン軌道相互作用。重元素 (W 5d ~0.4 eV / V 3d ~0.05 eV) で重要。計算コスト 2-3 倍。'},
        {label: 'charge mode', value: bs.charge_mode,
         desc: 'インターカレーション系での電荷取り扱い。host のみなら neutral_complex で OK。'},
        {label: 'intercalant 電荷', value: bs.intercalant_charge, unit: 'e',
         desc: 'ゲスト分子の正味電荷（+1 でカチオン）。'},
      ], '計算の精度・物理モデルの設定。後で結果と比較するときの "計算条件" として残す。')}

      ${v.site_magnetization ? card('原子別磁気モーメント',
        v.site_magnetization.map((m, i) => {
          const val = Array.isArray(m) ? `(${m.map(x=>x.toFixed(3)).join(', ')})` : (typeof m === 'number' ? m.toFixed(3) : String(m));
          return {label: `atom #${i+1}`, value: val, fmt: val, unit: 'μB',
                  desc: i === 0 ? '各原子サイトの局所磁気モーメント。' + (Array.isArray(m) ? 'SOC 下では (μx, μy, μz) ベクトル。' : 'スカラー（共線スピン）。') : ''};
        }),
      '<b>局所磁性</b>の確認用。VSe₂ なら V のみが ~0–1 μB、Se はほぼ 0 のはず。'
      ) : ''}
    </div>
  `;
}

// =========================================================
// Modal close
// =========================================================

function closeModal() {
  document.getElementById('modal').hidden = true;
  if (structAnimFrame) { cancelAnimationFrame(structAnimFrame); structAnimFrame = null; }
  if (structRenderer) { structRenderer.dispose(); structRenderer = null; }
  currentPK = null;
  scheduleAuto();
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.querySelector('#modal .backdrop').addEventListener('click', closeModal);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('modal').hidden) closeModal();
});

document.getElementById('refresh').addEventListener('click', load);
document.getElementById('filter').addEventListener('change', () => load());
document.getElementById('auto').addEventListener('change', () => {
  if (document.getElementById('auto').checked) scheduleAuto();
  else if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
});

window.addEventListener('resize', () => {
  if (!structRenderer || document.getElementById('modal').hidden) return;
  const wrap = document.getElementById('struct-canvas-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  structRenderer.setSize(W, H);
  structCamera.aspect = W/H;
  structCamera.updateProjectionMatrix();
});

load();
</script>
